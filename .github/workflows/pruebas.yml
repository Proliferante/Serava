# ═══════════════════════════════════════════════════════════════════════════
#  Pruebas automáticas — corren en cada Pull Request y en cada push a main.
#
#  Si alguna falla, el PR sale en rojo y (con la protección de `main` puesta
#  en GitHub) no se puede fusionar. Es la red que evita que un error llegue a
#  zequara.com: Vercel y Railway despliegan `main` solos, sin preguntar.
#
#  Dos trabajos en paralelo:
#    · backend   — las pruebas de pytest (sesión, permisos, frenos, HUB).
#    · frontend  — TypeScript y el `next build` completo, que es lo mismo que
#                  hace Vercel al desplegar: si aquí compila, allí también.
#
#  Ninguno toca la base de datos ni necesita secretos: las pruebas del
#  backend usan una base simulada en memoria, y el build del frontend, sin
#  backend, pinta las páginas vacías en vez de fallar.
# ═══════════════════════════════════════════════════════════════════════════

name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

# Si llega otro push a la misma rama, la corrida vieja ya no importa.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # La misma que la imagen de Docker (backend/Dockerfile).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q

  frontend:
    name: Frontend (TypeScript + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
